[tool.ruff]
# Only lint the Python tooling; firmware (C++) lives elsewhere.
#
# tools/hil was added to this list 2026-07-29, when the HIL rig landed:
# before that, `include` silently scoped OUT tools/hil even when
# it was named explicitly on the CLI (`ruff check tools/obd_scan tools/hil`,
# ci.yml's lint job) — confirmed by adding a deliberately-unused import to
# hil/parse.py and observing ruff report zero files/zero violations both
# with `ruff check tools/hil` alone and combined with tools/obd_scan. CI's
# lint job had been trivially green without ever linting this package.
include = ["tools/obd_scan/**/*.py", "tools/hil/**/*.py"]
line-length = 120

[tool.ruff.lint]
# Low-noise ruleset: pyflakes (F), pycodestyle errors (E), isort (I).
# Deliberately not enabling opinionated rule sets (e.g. D, ANN, PL, UP) that
# would flag the whole codebase for style choices rather than real bugs.
select = ["E", "F", "I"]
ignore = [
    # E701/E702 (multiple statements per line via ':' / ';') fire ~50 times on
    # two deliberate, pre-existing idioms that are readable as written and not
    # bugs: (1) stages.py's aligned "if name == ...: return ..." decode table,
    # and (2) test setup/teardown one-liners like
    # "s = ElmSession(...); s.connect(); s.init()" / "s.close(); fake.stop()"
    # repeated across test_elm.py / test_stages.py. Enabling these rules here
    # would just churn dozens of unrelated lines for a style preference with
    # no correctness benefit -- true noise for this codebase.
    "E701",
    "E702",
]
