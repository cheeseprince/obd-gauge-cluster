; OBD stat display. Primary target: CrowPanel Advance 3.5" ESP32-S3 (crowpanel_obd).
; One board: the CrowPanel Advance. The Elecrow WROVER-B and its classic-Bluetooth
; transport were retired and removed.
[platformio]
default_envs = crowpanel_obd

[env:crowpanel]
; PINNED to an explicit pioarduino release URL, not the bare name `espressif32`:
; the bare name resolves to whatever is installed, which on a clean CI runner is
; PlatformIO's own (core-2.x) platform, not pioarduino. That difference is silent
; and shows up as a core-3-only symbol failing to compile.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi   ; N16R8: QIO flash + OPI PSRAM
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D MOCK_OBD=1                 ; mock data for display/UI bring-up
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1  ; S3 native USB serial is off by default
    -D BOARD_CROWPANEL=1
    '-D OTA_ENV="crowpanel"'          ; release-manifest key for the menu update check
    '-D OTA_BASE_URL="https://cheeseprince.github.io/obd-gauge-cluster/"'
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    lvgl/lvgl@^8.4.0
    https://github.com/arduino-libraries/Modulino.git

; CrowPanel Advance — REAL OBD over BLE (vLinker MS in BT+BLE mode).
; Same as crowpanel but BLE_OBD instead of MOCK_OBD, plus NimBLE.
[env:crowpanel_obd]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D BLE_OBD=1                  ; BleObdSource (NimBLE); no MOCK_OBD
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_CROWPANEL=1
    '-D OTA_ENV="crowpanel_obd"'          ; release-manifest key for the menu update check
    '-D OTA_BASE_URL="https://cheeseprince.github.io/obd-gauge-cluster/"'
    ; Stamp the splash/menu with the build date (YYYY/MM/DD). The git hash comes from
    ; src/fw_git.h (set by publish_ota.sh / the release workflow; the flashed build has no .git).
    !echo "-DFW_DATE=\\\"$(date +%%Y/%%m/%%d)\\\""
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    lvgl/lvgl@^8.4.0
    https://github.com/arduino-libraries/Modulino.git
    h2zero/NimBLE-Arduino@^2.1.2

; Vehicle bring-up build: crowpanel_obd plus the serial probe console.
;
; The 'e'/'x'/'d'/'g' probe keys are compiled out of the shipped firmware (F-11)
; because that console is unauthenticated and 'x' sweeps 544 PIDs, monopolising
; the OBD link for minutes — on a moving vehicle that is a denial of the gauges.
; Discovering a new vehicle's PID map is a bench activity, so it gets its own
; build rather than living in everyone's dash.
;
;   pio run -e crowpanel_obd_dev -t upload
;
; `extends` + interpolating the parent's build_flags keeps this in lockstep with
; crowpanel_obd; redefining build_flags without the ${...} would REPLACE the
; parent's list, not append to it. OTA_ENV is inherited on purpose — a dev unit
; that runs "Check update" pulls itself back to the stock release. The release
; workflow only ever builds crowpanel_obd, so this env cannot be published.
[env:crowpanel_obd_dev]
extends = env:crowpanel_obd
build_flags =
    ${env:crowpanel_obd.build_flags}
    -D OBD_DEV_CONSOLE=1
