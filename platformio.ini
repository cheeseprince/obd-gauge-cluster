; OBD stat display. Primary target: CrowPanel Advance 3.5" ESP32-S3 (crowpanel_obd).
; elecrow* envs are the retired WROVER v2.2 board, kept buildable for reference.
[platformio]
default_envs = crowpanel_obd

[env:elecrow]
platform = espressif32@7.0.1   ; pin core-2.x (global pioarduino install shadows the unversioned name)
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<display_lovyangfx.cpp> -<encoder_input.cpp>   ; old board: exclude CrowPanel HAL files
build_unflags = -std=gnu++11   ; Arduino framework defaults to C++11; src/ needs C++17
build_flags =
    -std=gnu++17               ; src/ uses C++17 features (inline constexpr, brace-init with default members)
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D MOCK_OBD=1                 ; use MockObdSource (real ELMduino source = later plan)
    -D HISTORY_LEN=75             ; elecrow mock env doesn't enable PSRAM (ring is in DRAM): 33 stats x 75 x 4B = 9.9KB fits (90 overflowed DRAM back at 35 stats)
    ; --- TFT_eSPI pins (this unit = rev v2.2), from bringup ---
    -D USER_SETUP_LOADED=1
    -D ILI9488_DRIVER=1
    ; TFT_WIDTH/HEIGHT intentionally NOT set here — the ILI9488 driver defines
    ; them (portrait 320x480) and setRotation(1) gives landscape. Defining them
    ; ourselves only triggers a redefinition warning; app code uses local W/H.
    -D TFT_MOSI=13
    -D TFT_MISO=33                ; v2.2
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D TOUCH_CS=12               ; v2.2
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=16000000
    -D SPI_TOUCH_FREQUENCY=2000000
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@^8.4.0

; Real-OBD build: same board settings as elecrow but NO MOCK_OBD (uses
; RealObdSource), plus ELMduino for live Bluetooth OBD. Duplicated verbatim
; because -U MOCK_OBD cannot undefine a -D MOCK_OBD=1 token in PlatformIO's
; flag-expansion order (macro names must be plain identifiers for -U).
[env:elecrow_obd]
platform = espressif32@7.0.1   ; pin core-2.x (global pioarduino install shadows the unversioned name)
board = esp32dev
framework = arduino
monitor_speed = 115200
; BT + ELMduino + LVGL together exceed the default 1.25MB app partition.
; huge_app.csv gives 3MB app (0x300000), well within the 4MB flash on WROVER-B.
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<display_lovyangfx.cpp> -<encoder_input.cpp>   ; old board: exclude CrowPanel HAL files
build_unflags = -std=gnu++11   ; Arduino framework defaults to C++11; src/ needs C++17
build_flags =
    -std=gnu++17               ; src/ uses C++17 features (inline constexpr, brace-init with default members)
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    ; NO -D MOCK_OBD → RealObdSource path compiled in
    -D HISTORY_LEN=210            ; elecrow_obd: 33 stats x 210 x 4B = 27.7KB fits (240 overflowed DRAM back at 35 stats)
    ; PSRAM enabled: ESP32-WROVER-B has 8MB PSRAM. BOARD_HAS_PSRAM tells the
    ; Arduino HAL to keep CONFIG_SPIRAM active so EXT_RAM_ATTR routes static
    ; buffers (e.g. the 38KB LVGL draw buffer) to external RAM, keeping
    ; internal DRAM free for the BT stack (which reserves ~0xdb5c bytes).
    -D BOARD_HAS_PSRAM
    ; --- TFT_eSPI pins (this unit = rev v2.2), from bringup ---
    -D USER_SETUP_LOADED=1
    -D ILI9488_DRIVER=1
    ; TFT_WIDTH/HEIGHT intentionally NOT set here — the ILI9488 driver defines
    ; them (portrait 320x480) and setRotation(1) gives landscape. Defining them
    ; ourselves only triggers a redefinition warning; app code uses local W/H.
    -D TFT_MOSI=13
    -D TFT_MISO=33                ; v2.2
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D TOUCH_CS=12               ; v2.2
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=16000000
    -D SPI_TOUCH_FREQUENCY=2000000
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@^8.4.0
    PowerBroker2/ELMduino@^3.3.0

; Host build: compile + run the pure-logic unit tests with the system toolchain.
[env:native]
platform = native
build_src_filter = +<*>
build_flags = -std=c++17 -Wall -Wextra -I src
test_framework = custom

; CrowPanel Advance 3.5" (ESP32-S3-WROOM-1-N16R8) — real firmware, mock OBD.
; Display = LovyanGFX (display_lovyangfx.cpp), input = Modulino encoder
; (encoder_input.cpp); the TFT_eSPI + PCF8574 files are excluded via src_filter.
[env:crowpanel]
platform = espressif32@7.0.1   ; pin core-2.x (global pioarduino install shadows the unversioned name)
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi   ; N16R8: QIO flash + OPI PSRAM
build_src_filter = +<*> -<display_esp32.cpp> -<button_input.cpp>
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D MOCK_OBD=1                 ; mock data for display/UI bring-up
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1  ; S3 native USB serial is off by default
    -D BOARD_CROWPANEL=1
    '-D OTA_ENV="crowpanel"'          ; release-manifest key for the menu update check
    '-D OTA_BASE_URL="https://cheeseprince.github.io/obd-gauge-cluster/"'
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    lvgl/lvgl@^8.4.0
    https://github.com/arduino-libraries/Modulino.git

; CrowPanel Advance — REAL OBD over BLE (vLinker MS in BT+BLE mode).
; Same as crowpanel but BLE_OBD instead of MOCK_OBD, plus NimBLE.
[env:crowpanel_obd]
platform = espressif32@7.0.1   ; pin core-2.x (global pioarduino install shadows the unversioned name)
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_src_filter = +<*> -<display_esp32.cpp> -<button_input.cpp>
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D BLE_OBD=1                  ; BleObdSource (NimBLE); no MOCK_OBD
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_CROWPANEL=1
    '-D OTA_ENV="crowpanel_obd"'          ; release-manifest key for the menu update check
    '-D OTA_BASE_URL="https://cheeseprince.github.io/obd-gauge-cluster/"'
    ; Stamp the splash/menu with the build date (YYYY/MM/DD). The git hash comes from
    ; src/fw_git.h (set by publish_ota.sh / the release workflow; the flashed build has no .git).
    !echo "-DFW_DATE=\\\"$(date +%%Y/%%m/%%d)\\\""
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    lvgl/lvgl@^8.4.0
    https://github.com/arduino-libraries/Modulino.git
    h2zero/NimBLE-Arduino@^1.4.2
