version: 2
updates:
  # Keep the GitHub Actions used by the CI/release workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # CI's Python tooling, now that requirements/*.txt exist for it to read.
  # This entry was pointless before: the workflows installed unpinned packages
  # inline, so there was no manifest and Dependabot had nothing to act on.
  # Pinning by hash is what makes an updater both possible and necessary —
  # pinned deps do not drift into fixes on their own, so something has to
  # propose the bump.
  #
  # Dependabot regenerates the hashes with the pin, so a bump PR stays
  # installable under --require-hashes.
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # The ClusterFuzzLite base image. This entry is what makes pinning that image
  # by digest safe: without it a pinned FROM would freeze the fuzzing toolchain
  # against an OSS-Fuzz platform that keeps moving. See the comment in
  # .clusterfuzzlite/Dockerfile -- the two changes only make sense together.
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
