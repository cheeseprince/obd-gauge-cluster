name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Firmware host tests + fuzz
        run: cd test && make
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: OBD scanner tests
        run: |
          python -m pip install --quiet --require-hashes -r requirements/test.txt
          cd tools/obd_scan && python -m pytest tests -q
      - name: HIL rig tests (pure logic, no board)
        run: cd tools/hil && python -m pytest tests -q
      - name: HIL emulator tests (ELM327 protocol, no board or Bluetooth)
        # The responder's output is parsed by the same firmware code that talks
        # to a real adapter, so byte-exactness is the contract. These run here
        # because they need neither hardware nor BlueZ — only ble_elm.py does,
        # and it is transport-only.
        run: cd tools/hil/emulator && python -m pytest tests -q

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Ruff (tools/obd_scan, tools/hil)
        run: |
          python -m pip install --quiet --require-hashes -r requirements/lint.txt
          ruff check tools/obd_scan tools/hil

  device-build:
    name: Device build (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: python -m pip install --quiet --require-hashes -r requirements/build.txt
      - name: Build the dash firmware
        run: pio run -e crowpanel_obd

      # The snapshot tool links the real UI against every vehicle profile, so
      # building it catches a profile that was added to src/vehicles/ but never
      # wired up — which is how it came to fail with "undefined reference to
      # JEEP_WS_PROFILE" while every other check stayed green. It needs LVGL from
      # .pio/libdeps, which the firmware build above has already fetched.
      - name: Build the UI snapshot tool
        run: cd tools/ui_snapshot && make

      # Then prove the committed screenshots still match what the firmware draws.
      # Renders are deterministic (FW_DATE is pinned in the tool's Makefile), and
      # the comparison is on decoded pixels, not file bytes, so a different Pillow
      # build cannot fail this.
      - name: Install docs-image dependencies
        run: python -m pip install --quiet --require-hashes -r requirements/docs.txt
      - name: Committed renders match the UI code
        run: |
          cd tools/ui_snapshot
          ./snapshot
          python3 render_docs_images.py --check

  pii-guard:
    name: PII guard (no real VINs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: No real VIN / serial data in tracked files
        run: python3 scripts/check_no_pii.py

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: gitleaks (no keys/tokens/passwords committed)
        run: |
          VER=8.21.2
          # SHA-256 of gitleaks_8.21.2_linux_x64.tar.gz, taken from the release's
          # own gitleaks_${VER}_checksums.txt and re-verified against an
          # independent download 2026-08-16.
          #
          # WHY THIS IS PINNED AND NOT JUST VERSIONED. Every Action in this repo
          # is SHA-pinned and every pip install uses --require-hashes; this was
          # the one unpinned executable in the pipeline, and it is the SECRET
          # SCANNER. A substituted binary's most valuable move is not to do
          # something loud -- it is to exit 0, silently blinding the check meant
          # to stop a committed key. Version-pinning alone does not prevent a
          # release asset being replaced.
          SHA=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          curl -sSL --retry 3 -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --no-git --source . --redact --exit-code 1
