name: Release

# Cut a release by pushing a tag (e.g. `git tag v1.0.0 && git push --tags`).
# The firmware is built in CI, stamped with the release tag as its version, and
# published to the gh-pages branch as manifest.txt + manifest.sig + the .bin.
# Devices fetch it from GitHub Pages via their "Check update" menu.
#
# Signing is MANDATORY on a tag push: the OTA_SIGNING_KEY secret must be set and
# must match the public key in src/ota_pubkey.h, or the run fails before it can
# publish. Devices enforce the signature, so an unsigned or mis-signed release is
# not a weaker release — it is one no device will install.
#
# A manual workflow_dispatch run is a DRY RUN: it builds and signs a dev-<hash>
# artifact to prove the pipeline works, but the publish step is guarded to tag
# pushes only (github.ref_type == 'tag'), so it never overwrites the live
# release on gh-pages. Only a real tag deploys.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --quiet platformio
      - name: Stamp firmware version
        run: |
          GIT=$(git rev-parse --short HEAD)
          echo "GIT=$GIT" >> "$GITHUB_ENV"
          # Tag pushes (v*) stamp the tag itself as the version; manual/
          # workflow_dispatch runs (no tag) fall back to a dev-<hash> form —
          # matches the FW_VERSION fallback baked into src/fw_git.h.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="dev-$GIT"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/#define FW_GIT \".*\"/#define FW_GIT \"$GIT\"/" src/fw_git.h
          sed -i "s/#define FW_VERSION \".*\"/#define FW_VERSION \"$VERSION\"/" src/fw_git.h
          echo "version=$VERSION git=$GIT"
      - name: Build crowpanel_obd
        run: pio run -e crowpanel_obd
      - name: Assemble the release
        run: |
          mkdir -p out
          BIN=.pio/build/crowpanel_obd/firmware.bin
          SHA=$(sha256sum "$BIN" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$BIN")
          cp "$BIN" out/crowpanel_obd.bin
          echo "crowpanel_obd $VERSION $SHA $SIZE crowpanel_obd.bin" > out/manifest.txt
          cat out/manifest.txt
      - name: Sign the manifest
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          # Signing is MANDATORY for a tagged release. Every stock build enforces
          # the manifest signature before downloading the .bin (a file-scope
          # static_assert in src/ota_update.cpp makes a real compiled-in pubkey a
          # build requirement), so an unsigned manifest is not a weaker release —
          # it is an UNINSTALLABLE one. Publishing it would leave the OTA channel
          # serving a manifest every device refuses, with a green check on the run.
          # Fail loudly instead, matching publish_ota.sh's gate.
          if [ -z "${OTA_SIGNING_KEY:-}" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::OTA_SIGNING_KEY is not set, so this tagged release would"
              echo "::error::publish an UNSIGNED manifest.txt. Every device enforces"
              echo "::error::manifest.sig and would refuse it, leaving the OTA channel"
              echo "::error::broken for all installed units."
              echo "::error::Fix: add the OTA_SIGNING_KEY secret (Settings -> Secrets and"
              echo "::error::variables -> Actions), then re-run this workflow."
              exit 1
            fi
            # workflow_dispatch is a dry run and never reaches the publish step,
            # so an absent key here is survivable — but say so plainly.
            echo "::warning::OTA_SIGNING_KEY not set — no manifest.sig produced."
            echo "::warning::This dry run cannot validate the signing path. A tag push"
            echo "::warning::would fail at this step until the secret is configured."
            exit 0
          fi
          printf '%s' "$OTA_SIGNING_KEY" > /tmp/otakey.pem
          openssl dgst -sha256 -sign /tmp/otakey.pem -out out/manifest.sig out/manifest.txt
          rm -f /tmp/otakey.pem
          echo "manifest.sig written ($(stat -c%s out/manifest.sig) bytes)"
          # Prove the signature verifies against the public key COMPILED INTO the
          # firmware, before publishing. A secret that is valid PEM but the wrong
          # keypair would otherwise sail through and be caught only by a device
          # refusing the update in the field. Reconstruct the PEM from the C string
          # literal in src/ota_pubkey.h: strip the indentation and quotes, join the
          # lines, then let printf %b turn the literal \n escapes into newlines.
          printf '%b' "$(sed -n '/BEGIN PUBLIC KEY/,/END PUBLIC KEY/{
                                   s/^[[:space:]]*"//; s/"[,;]*[[:space:]]*$//; p }' \
                         src/ota_pubkey.h | tr -d '\n')" > /tmp/otapub.pem
          if ! openssl pkey -pubin -in /tmp/otapub.pem -noout 2>/dev/null; then
            echo "::error::Could not reconstruct a valid public key from src/ota_pubkey.h."
            echo "::error::The header's format may have changed — check the PEM literal."
            exit 1
          fi
          if openssl dgst -sha256 -verify /tmp/otapub.pem \
               -signature out/manifest.sig out/manifest.txt; then
            echo "signature verifies against the compiled-in public key"
          else
            echo "::error::manifest.sig does NOT verify against src/ota_pubkey.h."
            echo "::error::The OTA_SIGNING_KEY secret is not the private half of the"
            echo "::error::public key compiled into the firmware — every device would"
            echo "::error::refuse this release. Check that the secret matches."
            exit 1
          fi
      - name: Publish to gh-pages
        # Tag pushes only. A manual workflow_dispatch run builds + signs above
        # (a dry run) but must NOT publish, or it would overwrite the live
        # tagged release on gh-pages with a dev-<hash> build.
        if: github.ref_type == 'tag'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          keep_files: false
      - name: Create GitHub Release
        # Tag pushes only. Cut a GitHub Release for this tag with the firmware +
        # manifest + signature as downloadable assets, so the Releases page
        # matches the OTA channel on gh-pages (devices update over the air and
        # never need these files by hand — they're for humans browsing the repo).
        # Idempotent: a re-run re-uploads assets instead of failing. Notes are
        # auto-generated from PRs merged since the previous tag.
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS="out/crowpanel_obd.bin out/manifest.txt"
          [ -f out/manifest.sig ] && ASSETS="$ASSETS out/manifest.sig"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $ASSETS --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" $ASSETS \
              --title "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
