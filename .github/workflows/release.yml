name: Release

# Cut a release by pushing a tag (e.g. `git tag v1.0.0 && git push --tags`).
# The firmware is built in CI, stamped with the release tag as its version, and
# published to the gh-pages branch as manifest.txt + manifest.sig + the .bin.
# Devices fetch it from GitHub Pages via their "Check update" menu.
#
# Signing is MANDATORY on a tag push: the OTA_SIGNING_KEY secret must be set and
# must match the public key in src/ota_pubkey.h, or the run fails before it can
# publish. Devices enforce the signature, so an unsigned or mis-signed release is
# not a weaker release — it is one no device will install.
#
# A manual workflow_dispatch run is a DRY RUN: it builds and signs a dev-<hash>
# artifact to prove the pipeline works, but the publish step is guarded to tag
# pushes only (github.ref_type == 'tag'), so it never overwrites the live
# release on gh-pages. Only a real tag deploys.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Default the whole workflow to read-only, then grant write on the one job that
# needs it. With a single job today this is the same effective privilege — the
# point is what happens NEXT: a job added later inherits read, and has to ask
# for write deliberately rather than silently receiving it. This is the job that
# handles OTA_SIGNING_KEY, so the default that new steps land in matters.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Push the built release to gh-pages, and create the GitHub Release.
      contents: write
      # Build provenance (see the attest step below). id-token mints the OIDC
      # token Sigstore uses to bind the attestation to this workflow+repo;
      # attestations lets the run record it. Neither grants repository access.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --quiet --require-hashes -r requirements/build.txt
      - name: Stamp firmware version
        run: |
          GIT=$(git rev-parse --short HEAD)
          echo "GIT=$GIT" >> "$GITHUB_ENV"
          # Tag pushes (v*) stamp the tag itself as the version; manual/
          # workflow_dispatch runs (no tag) fall back to a dev-<hash> form —
          # matches the FW_VERSION fallback baked into src/fw_git.h.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="dev-$GIT"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/#define FW_GIT \".*\"/#define FW_GIT \"$GIT\"/" src/fw_git.h
          sed -i "s/#define FW_VERSION \".*\"/#define FW_VERSION \"$VERSION\"/" src/fw_git.h
          echo "version=$VERSION git=$GIT"
      - name: Notices match what is about to ship
        # BEFORE the build, not after: this is the last cheap moment to stop a
        # release whose THIRD-PARTY-NOTICES.md disagrees with the dependencies
        # it is about to link. That file is copied into the release assets and
        # onto gh-pages a few steps below, and it is the whole of how the binary
        # meets the notice terms of LGPL-2.1, Apache-2.0 and MPL-2.0. CI runs the
        # same guard on every PR (tools/obd_scan/tests/test_notices_guard.py);
        # it is repeated here because a tag can be cut from any commit, and a
        # release is the point where the obligation actually attaches.
        run: python3 scripts/check_notices.py

      - name: Build crowpanel_obd
        run: pio run -e crowpanel_obd
      - name: Assemble the release
        run: |
          mkdir -p out
          BIN=.pio/build/crowpanel_obd/firmware.bin
          SHA=$(sha256sum "$BIN" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$BIN")
          cp "$BIN" out/crowpanel_obd.bin
          echo "crowpanel_obd $VERSION $SHA $SIZE crowpanel_obd.bin" > out/manifest.txt
          cat out/manifest.txt
          # Ship the third-party notices WITH the binary, not merely in the
          # repository. The firmware statically links LGPL-2.1, Apache-2.0,
          # MPL-2.0, BSD and MIT code, and several of those licences require
          # their notices to accompany a redistribution IN BINARY FORM
          # specifically. Someone who only ever fetches crowpanel_obd.bin from
          # gh-pages -- which is every device doing an OTA -- would otherwise
          # receive none of them.
          cp THIRD-PARTY-NOTICES.md out/THIRD-PARTY-NOTICES.md
      - name: Sign the manifest
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          # Signing is MANDATORY for a tagged release. Every stock build enforces
          # the manifest signature before downloading the .bin (a file-scope
          # static_assert in src/ota_update.cpp makes a real compiled-in pubkey a
          # build requirement), so an unsigned manifest is not a weaker release —
          # it is an UNINSTALLABLE one. Publishing it would leave the OTA channel
          # serving a manifest every device refuses, with a green check on the run.
          # Fail loudly instead, matching publish_ota.sh's gate.
          if [ -z "${OTA_SIGNING_KEY:-}" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::OTA_SIGNING_KEY is not set, so this tagged release would"
              echo "::error::publish an UNSIGNED manifest.txt. Every device enforces"
              echo "::error::manifest.sig and would refuse it, leaving the OTA channel"
              echo "::error::broken for all installed units."
              echo "::error::Fix: add the OTA_SIGNING_KEY secret (Settings -> Secrets and"
              echo "::error::variables -> Actions), then re-run this workflow."
              exit 1
            fi
            # workflow_dispatch is a dry run and never reaches the publish step,
            # so an absent key here is survivable — but say so plainly.
            echo "::warning::OTA_SIGNING_KEY not set — no manifest.sig produced."
            echo "::warning::This dry run cannot validate the signing path. A tag push"
            echo "::warning::would fail at this step until the secret is configured."
            exit 0
          fi
          # Key hygiene: this step runs under `bash -e`, so ANY failure below aborts
          # immediately — a trailing `rm` would be skipped and the ECDSA private key,
          # the root of trust for every OTA update, would sit readable in the runner's
          # temp dir for the rest of the job. A malformed secret is exactly the case
          # this step exists to catch, so that path must not leak the key. Clean up
          # from an EXIT trap (matching publish_ota.sh:51,61) and write at 0600.
          # RUNNER_TEMP is job-scoped and runner-cleaned; /tmp is the fallback.
          TMPD="${RUNNER_TEMP:-/tmp}"
          umask 077
          trap 'rm -f "$TMPD/otakey.pem" "$TMPD/otapub.pem"' EXIT
          printf '%s' "$OTA_SIGNING_KEY" > "$TMPD/otakey.pem"
          openssl dgst -sha256 -sign "$TMPD/otakey.pem" -out out/manifest.sig out/manifest.txt
          echo "manifest.sig written ($(stat -c%s out/manifest.sig) bytes)"
          # Prove the signature verifies against the public key COMPILED INTO the
          # firmware, before publishing. A secret that is valid PEM but the wrong
          # keypair would otherwise sail through and be caught only by a device
          # refusing the update in the field. Reconstruct the PEM from the C string
          # literal in src/ota_pubkey.h: strip the indentation and quotes, join the
          # lines, then let printf %b turn the literal \n escapes into newlines.
          printf '%b' "$(sed -n '/BEGIN PUBLIC KEY/,/END PUBLIC KEY/{
                                   s/^[[:space:]]*"//; s/"[,;]*[[:space:]]*$//; p }' \
                         src/ota_pubkey.h | tr -d '\n')" > "$TMPD/otapub.pem"
          if ! openssl pkey -pubin -in "$TMPD/otapub.pem" -noout 2>/dev/null; then
            echo "::error::Could not reconstruct a valid public key from src/ota_pubkey.h."
            echo "::error::The header's format may have changed — check the PEM literal."
            exit 1
          fi
          if openssl dgst -sha256 -verify "$TMPD/otapub.pem" \
               -signature out/manifest.sig out/manifest.txt; then
            echo "signature verifies against the compiled-in public key"
          else
            echo "::error::manifest.sig does NOT verify against src/ota_pubkey.h."
            echo "::error::The OTA_SIGNING_KEY secret is not the private half of the"
            echo "::error::public key compiled into the firmware — every device would"
            echo "::error::refuse this release. Check that the secret matches."
            exit 1
          fi
      - name: Generate SBOM
        # Runs on dry runs TOO, deliberately. This was previously tag-only, so a
        # workflow_dispatch rehearsal skipped it and the first time it ever ran
        # was a real release — which is exactly how v0.1.4 failed after the
        # firmware had already been built and signed. The dry run's whole job is
        # to prove the pipeline; a step it never executes is not proven.
        # Attestation below stays tag-only: that mints a real Sigstore entry.
        #
        # NOT GitHub's automatic dependency-graph SBOM. That one sees
        # requirements/*.txt and .github/workflows/, so it lists pytest, numpy,
        # pandas and a set of Actions — none of which are in the firmware.
        # Shipping it beside the .bin would assert that a vehicle gauge cluster
        # contains pandas, which is worse than no SBOM because it would be
        # believed. tools/gen_sbom.py reads what PlatformIO actually resolved
        # and linked, and keeps build tools in a separate scope from what is
        # compiled into the image.
        run: |
          python3 tools/gen_sbom.py \
            --env crowpanel_obd \
            --bin out/crowpanel_obd.bin \
            --version "$VERSION" \
            --output out/crowpanel_obd.bin.cdx.json

      - name: Validate the SBOM is attestable
        # actions/attest sniffs the format with
        #   checkIsCycloneDX = !!(bomFormat && serialNumber && specVersion)
        # and rejects anything else as "Unsupported SBOM format". serialNumber is
        # OPTIONAL in the CycloneDX spec, so a perfectly valid document can fail
        # that check — v0.1.4 did. Assert it here, where the error names the
        # missing field, instead of discovering it inside a third-party action
        # after the build and signature have already been produced.
        run: |
          python3 - <<'EOF'
          import json, sys
          sbom = json.load(open("out/crowpanel_obd.bin.cdx.json"))
          missing = [k for k in ("bomFormat", "serialNumber", "specVersion")
                     if not sbom.get(k)]
          if missing:
              sys.exit("SBOM is not attestable — actions/attest requires "
                       f"{', '.join(missing)}. See tools/gen_sbom.py.")
          print(f"SBOM is attestable: {sbom['bomFormat']} {sbom['specVersion']}, "
                f"{len(sbom.get('components', []))} components, "
                f"{sbom['serialNumber']}")
          EOF

      - name: Attest SBOM
        # Binds the SBOM to this exact .bin through Sigstore, the same way the
        # provenance step binds the build. An unsigned SBOM is a claim; an
        # attested one is a claim someone can check:
        #   gh attestation verify crowpanel_obd.bin --repo <repo>
        #
        # actions/attest, not actions/attest-sbom: the latter is deprecated and
        # since v0.1.5 emitted "actions/attest-sbom has been deprecated, please
        # use actions/attest instead" on every release. It was only a thin
        # wrapper — the v0.1.4/v0.1.5 logs show it invoking actions/attest with
        # these same two inputs — so this is the same operation without the
        # indirection. sbom-path still selects the SBOM predicate type
        # automatically; predicate-type is only needed with predicate/-path.
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: out/crowpanel_obd.bin
          sbom-path: out/crowpanel_obd.bin.cdx.json

      - name: Attest build provenance
        # Tag pushes only — a workflow_dispatch dry run must not mint an
        # attestation for a build nobody can install.
        if: github.ref_type == 'tag'
        # Provenance answers a DIFFERENT question than manifest.sig, which is why
        # both exist. The signature proves someone holding OTA_SIGNING_KEY blessed
        # these bytes. Provenance proves the bytes came out of THIS workflow, at
        # THIS commit, in THIS repository — so a key holder who was tricked into
        # signing an artifact they did not build is detectable, and a .bin
        # uploaded by hand cannot masquerade as a CI build.
        #
        # Signed by Sigstore against the job's OIDC identity and recorded in the
        # public transparency log. Verify with:
        #   gh attestation verify crowpanel_obd.bin --repo cheeseprince/obd-gauge-cluster
        #
        # Devices do NOT check this — they enforce manifest.sig and the SHA-256,
        # and have neither the trust root nor the flash for Sigstore. This is for
        # humans and for tooling auditing the release, not an on-device control.
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: out/crowpanel_obd.bin

      - name: Stage the provenance bundle as a release asset
        # The action already records the attestation in the repository's
        # attestation store, which is what `gh attestation verify` reads. This
        # ALSO drops the bundle next to the .bin as a release asset, for two
        # reasons: a human downloading the firmware by hand gets the provenance
        # in the same place, and tooling that looks for a provenance FILE on the
        # release (rather than querying the attestations API) can find it.
        if: github.ref_type == 'tag'
        run: cp "${{ steps.attest.outputs.bundle-path }}" out/crowpanel_obd.bin.intoto.jsonl

      - name: Publish to gh-pages
        # Tag pushes only. A manual workflow_dispatch run builds + signs above
        # (a dry run) but must NOT publish, or it would overwrite the live
        # tagged release on gh-pages with a dev-<hash> build.
        if: github.ref_type == 'tag'
        # Pinned to a commit SHA, not the `v4` tag. This is the one third-party
        # action in the repo, and it runs in the job that holds OTA_SIGNING_KEY —
        # a force-pushed tag here would hand an attacker the OTA root of trust.
        # Dependabot reads the trailing comment and bumps SHA + comment together.
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          keep_files: false
      - name: Create GitHub Release
        # Tag pushes only. Cut a GitHub Release for this tag with the firmware +
        # manifest + signature as downloadable assets, so the Releases page
        # matches the OTA channel on gh-pages (devices update over the air and
        # never need these files by hand — they're for humans browsing the repo).
        # Idempotent: a re-run re-uploads assets instead of failing. Notes are
        # auto-generated from PRs merged since the previous tag.
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # manifest.sig is unconditional: this step is tag-only, and the signing
          # step above fails the run on a tag without a valid signature. Listing it
          # unconditionally means a missing sig fails loudly here rather than
          # silently publishing a Release whose assets don't match the OTA channel.
          # The provenance bundle is listed unconditionally for the same reason as
          # manifest.sig: the attest step above is tag-gated and fails the run on
          # error, so on a tag it is always present. A missing bundle should fail
          # here rather than quietly ship a release without provenance.
          # THIRD-PARTY-NOTICES.md is listed unconditionally and deliberately.
          # It is not a convenience: the licences of code linked into the binary
          # require their notices to accompany a redistribution in binary form,
          # and a Release asset IS such a redistribution. If the file is missing
          # this step should fail rather than publish a binary without it.
          ASSETS="out/crowpanel_obd.bin out/manifest.txt out/manifest.sig out/crowpanel_obd.bin.intoto.jsonl out/crowpanel_obd.bin.cdx.json out/THIRD-PARTY-NOTICES.md"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $ASSETS --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" $ASSETS \
              --title "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
